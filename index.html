<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEARN WORDS</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <header class="dashboard-header">
        <h1>단어 학습</h1>
        <span class="word-data-actions">
          <button id="backup-btn" class="btn btn-secondary" type="button">단어 백업</button>
          <button id="import-btn" class="btn btn-secondary" type="button">단어 불러오기</button>
        </span>
      </header>

      <main class="dashboard-main">
        <!-- 단어 추가 폼 -->
        <section class="add-word-section">
          <h2>새로운 단어 추가</h2>
          <div class="form-group">
            <label for="word-input">단어</label>
            <input 
              type="text" 
              id="word-input" 
              placeholder="추가할 단어를 입력하세요"
              class="input-field"
            />
          </div>

          <div class="form-group">
            <label for="pronunciation-input">발음</label>
            <input 
              type="text" 
              id="pronunciation-input" 
              placeholder="단어의 발음을 입력하세요"
              class="input-field"
            />
          </div>

          <div class="form-group">
            <label for="meaning-input">뜻</label>
            <input 
              type="text" 
              id="meaning-input" 
              placeholder="단어의 뜻을 입력하세요"
              class="input-field"
            />
          </div>

          <button id="add-btn" class="btn btn-primary">추가</button>
          <button id="cancel-edit-btn" class="btn btn-cancel" type="button" style="display: none;">편집 취소</button>
        </section>

        <!-- 저장된 단어 목록 -->
        <section class="words-list-section">
          <div class="words-list-header">
            <h2>
              <span>저장된 단어 (<span id="word-count">0</span>)</span>
              <button id="clear-all-btn" class="btn btn-danger" type="button" disabled>전체 삭제</button>
            </h2>
            <input id="import-file-input" type="file" accept="application/json,.json" hidden />
          </div>
          <div id="words-list" class="words-list">
            <p class="empty-message">아직 저장된 단어가 없습니다.</p>
          </div>
        </section>

        <!-- 시험 시작 영역 -->
        <section class="test-section dashboard-test-section">
          <h2>단어 시험</h2>
          <p class="test-description">저장된 단어로 시험을 시작합니다.</p>
          <a id="start-test-btn" class="btn btn-primary" href="test.html" style="display: none; text-align: center; text-decoration: none;">시험 시작</a>
          <a id="start-survival-btn" class="btn btn-survival" href="test.html?mode=survival" style="display: none; text-align: center; text-decoration: none;">서바이벌 시험 시작</a>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/add_words.js"></script>
  </body>
</html>
